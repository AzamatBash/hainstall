services:
  haproxy:
    container_name: haproxy
    image: haproxy:3.0-alpine
    # Local bake (optional): build from ./haproxy/Dockerfile
    # build:
    #   context: ./haproxy
    #   dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./haproxy/backends.d:/etc/haproxy/backends.d
      - ./certs:/etc/haproxy/certs:ro
      - haproxy-run:/var/run/haproxy
    command: ["haproxy", "-W", "-db", "-f", "/usr/local/etc/haproxy/haproxy.cfg", "-f", "/etc/haproxy/backends.d"]
    networks:
      - hapnet
    depends_on:
      - agent

  agent:
    container_name: hapanel-agent
    image: azamatbash/hanode:0.1.0
    # Local build (optional):
    # build:
    #   context: ../..
    #   dockerfile: deploy/node/agent/Dockerfile
    restart: unless-stopped
    ports:
      # Panel ↔ agent directly (not through HAProxy)
      - "47893:9100"
    environment:
      HAPANEL_TOKEN: ${HAPANEL_TOKEN:?set HAPANEL_TOKEN in .env}
      HAPANEL_LISTEN: "0.0.0.0:9100"
      HAPROXY_SOCKET: /var/run/haproxy/admin.sock
      HAPROXY_BACKENDS_DIR: /etc/haproxy/backends.d
      HAPANEL_STATE_PATH: /var/lib/hapanel/state.json
      DOCKER_HOST: unix:///var/run/docker.sock
      HAPROXY_CONTAINER: haproxy
      HAPANEL_DEFAULT_BACKEND: app
      HOST_PROC: /host/proc
      HOST_ROOT: /host/root
    volumes:
      - ./haproxy/backends.d:/etc/haproxy/backends.d
      - haproxy-run:/var/run/haproxy
      - agent-state:/var/lib/hapanel
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /:/host/root:ro
    networks:
      - hapnet
    # Agent needs to write backends.d and talk to docker.sock as root-ish;
    # run as root inside container for MVP (socket + shared volume perms).
    user: "0:0"
    group_add:
      - ${DOCKER_GID:-0}

networks:
  hapnet:
    driver: bridge

volumes:
  haproxy-run:
  agent-state:
