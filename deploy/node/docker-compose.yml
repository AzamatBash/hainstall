services:
  haproxy:
    container_name: haproxy
    image: haproxy:3.0-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "8443:8443"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./haproxy/backends.d:/etc/haproxy/backends.d
      - ./certs:/etc/haproxy/certs:ro
    command: ["haproxy", "-W", "-db", "-f", "/usr/local/etc/haproxy/haproxy.cfg", "-f", "/etc/haproxy/backends.d"]
    # expose runtime API only on docker network (not published to host)
    expose:
      - "9999"
    sysctls:
      net.ipv4.ip_local_port_range: "1024 65535"
      net.ipv4.tcp_tw_reuse: "1"
      net.ipv4.tcp_fin_timeout: "15"
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    networks:
      - hapnet
    depends_on:
      - agent

  agent:
    container_name: hapanel-agent
    image: azamatbash/hanode:0.1.0
    restart: unless-stopped
    ports:
      - "47893:9100"
    environment:
      HAPANEL_TOKEN: ${HAPANEL_TOKEN:?set HAPANEL_TOKEN in .env}
      HAPANEL_LISTEN: "0.0.0.0:9100"
      HAPROXY_SOCKET: tcp://haproxy:9999
      HAPROXY_BACKENDS_DIR: /etc/haproxy/backends.d
      HAPANEL_STATE_PATH: /var/lib/hapanel/state.json
      DOCKER_HOST: unix:///var/run/docker.sock
      HAPROXY_CONTAINER: haproxy
      HAPANEL_DEFAULT_BACKEND: app
      HOST_PROC: /host/proc
      HOST_ROOT: /host/root
    volumes:
      - ./haproxy/backends.d:/etc/haproxy/backends.d
      - agent-state:/var/lib/hapanel
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /:/host/root:ro
    networks:
      - hapnet
    user: "0:0"
    group_add:
      - ${DOCKER_GID:-0}

networks:
  hapnet:
    driver: bridge

volumes:
  agent-state:
