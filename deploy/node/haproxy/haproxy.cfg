#---------------------------------------------------------------------
# Hapanel node HAProxy — client traffic only (:80 / :8443).
# Panel ↔ agent is NOT here: agent publishes :47893 → :9100 directly.
# :8443 = TCP passthrough (Reality/VLESS); no TLS termination.
# Managed backends are loaded via: -f /etc/haproxy/backends.d
#---------------------------------------------------------------------

global
    maxconn 50000
    nbthread 4
    # TCP runtime API for the agent (same docker network). Do not publish :9999 to the host.
    stats socket ipv4@0.0.0.0:9999 level admin
    stats timeout 30s
    master-worker

defaults
    mode    tcp
    no log
    timeout connect 5s
    timeout client  30m
    timeout server  30m
    timeout tunnel  30m
    timeout client-fin 30s
    timeout server-fin 30s
    retries 2

# ACME / redirect on :80 (HTTP mode only for this frontend)
frontend http_plain
    mode http
    bind *:80
    acl is_acme path_beg /.well-known/acme-challenge/
    http-request redirect scheme https code 301 unless is_acme
    use_backend acme if is_acme

# Client :8443 — TCP passthrough for Reality/VLESS
frontend https_front
    mode tcp
    bind *:8443
    maxconn 40000
    default_backend app

backend acme
    mode http
    server local 127.0.0.1:8080
