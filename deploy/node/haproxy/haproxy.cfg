#---------------------------------------------------------------------
# Hapanel node HAProxy — client traffic only (:80 / :443).
# Panel ↔ agent is NOT here: agent publishes :47893 → :9100 directly.
# :443 = TCP passthrough (Reality/VLESS); no TLS termination.
# Managed backends are loaded via: -f /etc/haproxy/backends.d
#---------------------------------------------------------------------

global
    # Access logs off on nodes (no log stdout / tcplog / httplog).
    maxconn 20000
    stats socket /var/run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    master-worker

defaults
    mode    tcp
    no log
    timeout connect 10s
    timeout client  30m
    timeout server  30m
    timeout tunnel  30m
    retries 3

# ACME / redirect on :80 (HTTP mode only for this frontend)
frontend http_plain
    mode http
    bind *:80
    acl is_acme path_beg /.well-known/acme-challenge/
    http-request redirect scheme https code 301 unless is_acme
    use_backend acme if is_acme

# Client :443 — TCP passthrough, no ssl crt
frontend https_front
    mode tcp
    bind *:443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }
    default_backend app

backend acme
    mode http
    # Local stub; mount ACME webroot or point elsewhere in production.
    server local 127.0.0.1:8080
